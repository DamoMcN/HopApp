<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hop App - Sign Up</title>
    <link rel="stylesheet" href="../shared/css/main.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-container">
    <div class="logo">
        <img src="../shared/img/HopBunnie.png" alt="Hop App Logo">
    </div>

    <form onsubmit="handleSignup(event)" id="signup-form">
        
        <div class="form-row">
            <div class="form-group">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="first_name" required placeholder="First Name">
            </div>
            <div class="form-group">
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="last_name" required placeholder="Last Name">
            </div>
        </div>

        <div class="form-group">
            <label for="phone-number">Phone Number</label>
            <input type="tel" id="phone-number" name="phone_number" required placeholder="e.g. +353 8X XXX XXXX">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
            </div>
            <div class="form-group">
    <label for="nationality">Nationality</label>
    <select id="nationality" name="nationality" required>
        <option value="" disabled selected>Select nationality</option>
        <option value="Ireland">Ireland</option>
        <option value="United Kingdom">United Kingdom</option>
        <option value="Ukraine">Ukraine</option>
        <option disabled>──────────</option>
        <option value="Afghanistan">Afghanistan</option>
        <option value="Albania">Albania</option>
        <option value="Algeria">Algeria</option>
        <option value="Argentina">Argentina</option>
        <option value="Australia">Australia</option>
        <option value="Austria">Austria</option>
        <option value="Bangladesh">Bangladesh</option>
        <option value="Belgium">Belgium</option>
        <option value="Brazil">Brazil</option>
        <option value="Bulgaria">Bulgaria</option>
        <option value="Canada">Canada</option>
        <option value="China">China</option>
        <option value="Croatia">Croatia</option>
        <option value="Czech Republic">Czech Republic</option>
        <option value="Denmark">Denmark</option>
        <option value="Egypt">Egypt</option>
        <option value="Estonia">Estonia</option>
        <option value="Finland">Finland</option>
        <option value="France">France</option>
        <option value="Germany">Germany</option>
        <option value="Greece">Greece</option>
        <option value="Hungary">Hungary</option>
        <option value="India">India</option>
        <option value="Italy">Italy</option>
        <option value="Japan">Japan</option>
        <option value="Latvia">Latvia</option>
        <option value="Lithuania">Lithuania</option>
        <option value="Malaysia">Malaysia</option>
        <option value="Mexico">Mexico</option>
        <option value="Netherlands">Netherlands</option>
        <option value="New Zealand">New Zealand</option>
        <option value="Nigeria">Nigeria</option>
        <option value="Norway">Norway</option>
        <option value="Pakistan">Pakistan</option>
        <option value="Philippines">Philippines</option>
        <option value="Poland">Poland</option>
        <option value="Portugal">Portugal</option>
        <option value="Romania">Romania</option>
        <option value="South Africa">South Africa</option>
        <option value="South Korea">South Korea</option>
        <option value="Spain">Spain</option>
        <option value="Sweden">Sweden</option>
        <option value="Switzerland">Switzerland</option>
        <option value="United States">United States</option>
        <option value="Thailand">Thailand</option>
        <option value="Turkey">Turkey</option>
        <option value="Other">Other</option>
    </select>
</div>
        </div>

        <div class="form-group">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" name="user_email" required placeholder="Email address">
        </div>

        <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" name="user_password" required placeholder="Create a strong password">
            <ul id="password-rules" class="password-rules">
                <li data-rule="length">At least 8 characters</li>
                <li data-rule="digit">At least one digit</li>
                <li data-rule="upper">One uppercase letter</li>
                <li data-rule="lower">One lowercase letter</li>
                <li data-rule="symbol">One symbol (e.g. ! @ # $ %)</li>
            </ul>
        </div>

        <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm_password" required placeholder="Confirm your password">
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem;">
            <input type="checkbox" id="is-student" name="is-student" style="width: auto; padding: 0;">
            <label for="is-student" style="margin: 0; cursor: pointer;">Are you a student?</label>
        </div>

        <button type="submit" class="submit-btn">Create Account</button>

        <div class="bottom-link">
            Already have an account? <a href="index.html">Log in here</a>
        </div>
    </form>
</div>

<!-- Eligibility Popup Modal -->
<div id="eligibility-modal" class="modal-overlay">
    <div class="modal-content">
        <h3 id="modal-title">Welcome to Hop!</h3>
        <p id="modal-desc">Based on your age, you are eligible for the following card options:</p>
        
        <div id="card-result" class="cards-container">
            <!-- Cards will be injected here via JS -->
        </div>

        <div class="modal-actions" id="modal-actions-container">
            <button type="button" id="modal-action-btn" class="modal-submit-btn" disabled onclick="window.location.href='index.html'">Create Account</button>
            <button type="button" class="back-link-btn" id="modal-back-btn" onclick="closeModal()">Back</button>
        </div>
    </div>
</div>

<a href="../support/support.html" class="global-help-btn">?</a>

<script src="auth.js"></script>
</body>
</html>
