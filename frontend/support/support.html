<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hop App - Help & Support</title>
  
  <link rel="stylesheet" href="../shared/css/main.css">
  <link rel="stylesheet" href="support.css">
</head>
<body>
  <main class="app support-app">
    <header class="topbar">
      <button class="back" onclick="goBack()">&#8592;</button>
    </header>

    <div class="flip-container">
      <div class="flip-inner" id="flipInner">
        
        <!-- Front: FAQ List -->
        <div class="flip-front">
          <section id="faqPage">
            <div class="hero">
              <div class="rabbit">
                <!-- Pointing to your shared images folder -->
                <img src="../shared/img/HopBunnie.png" alt="Hop App Mascot">
              </div>
              <h1>Help & Support</h1>
              <p class="subtitle">How can we help you?</p>
            </div>

            <div class="search-box">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
              </svg>
              <input class="search" id="search" type="search" placeholder="Search for help..." oninput="filterQuestions()">
            </div>

            <h2>Frequently Asked Questions</h2>
            <div id="questions"></div>
            <p id="empty" class="empty hidden">No matching questions found.</p>
            
            <button class="submit-btn" onclick="showContact()">Contact Support</button>
          </section>
        </div>

        <!-- Back: Answer Display -->
        <div class="flip-back">
          <section id="answerPage">
            <h1 id="answerTitle"></h1>
            <div class="answer" id="answerText"></div>
            <button class="submit-btn" onclick="showFAQ()">Back to FAQ</button>
          </section>
        </div>

      </div>
    </div>
  </main>

  <script src="support.js" defer></script>
</body>
</html>
