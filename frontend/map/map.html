<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Hop App - Bus Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="../shared/css/main.css">
    <link rel="stylesheet" href="../shared/css/navbar.css">
    <link rel="stylesheet" href="map.css">
    <!-- Start downloading the route index while the page and Leaflet load -->
    <link rel="preload" href="data/index.json" as="fetch" crossorigin="anonymous">
</head>
<body class="map-page has-bottom-nav" data-nav="map">

    <svg class="tint-defs" width="0" height="0" aria-hidden="true" focusable="false">
        <filter id="hop-map-tint" color-interpolation-filters="sRGB">
            <feColorMatrix type="matrix"
                values="0.2126 0.7152 0.0722 0 0
                        0.2126 0.7152 0.0722 0 0
                        0.2126 0.7152 0.0722 0 0
                        0      0      0      1 0"/>
            <feComponentTransfer>
                <feFuncR type="table" tableValues="0.24 0.93"/>
                <feFuncG type="table" tableValues="0.16 0.89"/>
                <feFuncB type="table" tableValues="0.36 0.97"/>
            </feComponentTransfer>
        </filter>
    </svg>

    <div class="map-app">
        <div id="map" role="application" aria-label="Map of Irish bus routes"></div>

        <!-- Floating top bar -->
        <header class="map-topbar">
            <button class="menu-btn" id="menu-btn" type="button" aria-label="Open menu">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <h1>Bus map</h1>
        </header>

        <!-- Loading / error message on top of the map -->
        <div id="map-message" class="map-message" role="status" aria-live="polite">
            <div class="spinner" aria-hidden="true"></div>
            <p id="map-message-text">Loading routes&hellip;</p>
            <button id="map-retry" class="map-retry" type="button" hidden>Try again</button>
        </div>

        <!-- Route finder: slides down out of the way with the handle -->
        <section class="plan-sheet is-collapsed" id="plan-sheet" aria-label="Find a route">
            <button class="sheet-handle" id="sheet-toggle" type="button"
                    aria-expanded="false" aria-controls="sheet-body">
                <span class="handle-bar" aria-hidden="true"></span>
                <span class="sr-only">Show or hide the route finder</span>
            </button>

            <!-- Two ways to use the map -->
            <div class="sheet-tabs" role="tablist" aria-label="Map mode">
                <button type="button" role="tab" id="tab-routes" class="sheet-tab"
                        aria-selected="true" aria-controls="panel-routes">Route view</button>
                <button type="button" role="tab" id="tab-ticket" class="sheet-tab"
                        aria-selected="false" aria-controls="panel-ticket" tabindex="-1">Buy a ticket</button>
            </div>

            <div class="sheet-body" id="sheet-body">
                <div class="sheet-scroll">
                  <div id="panel-routes" role="tabpanel" aria-labelledby="tab-routes">
                    <div class="field">
                        <label for="region-select">Region</label>
                        <select id="region-select" disabled>
                            <option value="">Loading regions&hellip;</option>
                        </select>
                    </div>

                    <div id="operator-filters" class="chips" role="group" aria-label="Operators" hidden>
                        <label class="chip chip-public">
                            <input type="checkbox" id="filter-tfi" checked>
                            <span>TFI / Public</span>
                        </label>
                        <label class="chip chip-citylink">
                            <input type="checkbox" id="filter-citylink" checked>
                            <span>Citylink</span>
                        </label>
                    </div>

                    <div id="route-container" class="field" hidden>
                        <label for="route-select">Route</label>
                        <select id="route-select">
                            <option value="all">Show all in region</option>
                        </select>
                    </div>

                    <div id="stop-selectors" hidden>
                        <div class="field">
                            <label for="depart-input">From</label>
                            <input type="text" id="depart-input" list="depart-list"
                                   placeholder="Start typing a stop" autocomplete="off">
                            <datalist id="depart-list"></datalist>
                        </div>
                        <div class="field">
                            <label for="arrive-input">To</label>
                            <input type="text" id="arrive-input" list="arrive-list"
                                   placeholder="Start typing a stop" autocomplete="off">
                            <datalist id="arrive-list"></datalist>
                        </div>
                        <p id="trip-hint" class="trip-hint" role="status" aria-live="polite"></p>
                    </div>

                    <p id="live-status" class="live-status" role="status" aria-live="polite" hidden></p>

                    <ul class="legend" aria-label="Map key">
                        <li><span class="dot dot-stop"></span>Stop</li>
                        <li><span class="dot dot-from"></span>From</li>
                        <li><span class="dot dot-to"></span>To</li>
                        <li><span class="dot dot-bus"></span>Live bus</li>
                    </ul>

                    <p class="soon-note">Stop times and delays are coming soon.</p>
                  </div>

                  <div id="panel-ticket" role="tabpanel" aria-labelledby="tab-ticket" hidden>
                    <div class="stop-pair">
                    <div class="field picker">
                        <label for="from-input">From</label>
                        <input type="text" id="from-input" role="combobox" aria-expanded="false"
                               aria-controls="from-results" aria-autocomplete="list"
                               placeholder="Search any bus stop" autocomplete="off">
                        <ul id="from-results" class="picker-results" role="listbox" aria-label="From stops" hidden></ul>
                    </div>

                    <div class="field picker">
                        <label for="to-input">To</label>
                        <input type="text" id="to-input" role="combobox" aria-expanded="false"
                               aria-controls="to-results" aria-autocomplete="list"
                               placeholder="Search any bus stop" autocomplete="off">
                        <ul id="to-results" class="picker-results" role="listbox" aria-label="To stops" hidden></ul>
                    </div>
                    <button type="button" id="swap-btn" class="swap-btn" aria-label="Swap From and To">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/>
                        </svg>
                    </button>
                    </div>

                    <p id="ticket-hint" class="trip-hint" role="status" aria-live="polite"></p>

                    <ul id="bus-list" class="bus-list" aria-label="Buses for this journey"></ul>

                    <div class="ticket-footer">
                        <button type="button" id="ticket-continue" class="continue-btn" disabled>Continue to ticket</button>
                    </div>
                  </div>
                </div>
            </div>
        </section>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="../shared/js/menu.js"></script>
    <script src="../shared/js/navbar.js"></script>
    <script src="map.js"></script>
</body>
</html>
