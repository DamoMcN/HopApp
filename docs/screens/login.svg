<svg xmlns="http://www.w3.org/2000/svg" width="320" height="620" viewBox="0 0 320 620" role="img" aria-label="Log in screen" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><clipPath id="c"><rect x="10" y="10" width="300" height="600" rx="30"/></clipPath>
<filter id="sh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3d2a5c" flood-opacity="0.25"/></filter></defs>
<rect x="10" y="10" width="300" height="600" rx="30" fill="#faf7fc" stroke="#3d2a5c" stroke-width="5" filter="url(#sh)"/>
<g clip-path="url(#c)" transform="translate(10,10)"><text x="150" y="100" font-size="44" fill="#3d2a5c" font-weight="800" text-anchor="middle">Hop</text><text x="150" y="126" font-size="13" fill="#7a6a90" font-weight="400" text-anchor="middle">Your bus card, simplified</text><text x="30" y="190" font-size="12" fill="#7a6a90" font-weight="700" text-anchor="start">Email</text><rect x="30" y="198" width="240" height="44" rx="12" fill="#ecdef0" stroke="none" stroke-width="1"/><text x="44" y="226" font-size="14" fill="#a898bd" font-weight="400" text-anchor="start">you@example.com</text><text x="30" y="268" font-size="12" fill="#7a6a90" font-weight="700" text-anchor="start">Password</text><rect x="30" y="276" width="240" height="44" rx="12" fill="#ecdef0" stroke="none" stroke-width="1"/><text x="44" y="304" font-size="14" fill="#3d2a5c" font-weight="400" text-anchor="start">••••••••</text><rect x="30" y="348" width="240" height="48" rx="14" fill="#c7aeef" stroke="none" stroke-width="1"/><text x="150" y="378" font-size="16" fill="#3d2a5c" font-weight="700" text-anchor="middle">Log in</text><text x="150" y="430" font-size="12" fill="#7a6a90" font-weight="500" text-anchor="middle">Forgot your password?</text><line x1="30" y1="462" x2="270" y2="462" stroke="#ece4f3"/><text x="150" y="492" font-size="13" fill="#7a6a90" font-weight="400" text-anchor="middle">New here?  <tspan font-weight="700" fill="#3d2a5c">Sign up</tspan></text></g>
</svg>